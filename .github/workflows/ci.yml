name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-postgres-migration:
    name: Canonical PostgreSQL fresh install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg2://pricepulse_test:pricepulse_test@localhost:5432/pricepulse_test
      PRICEPULSE_TEST_DATABASE_URL: postgresql+psycopg2://pricepulse_test:pricepulse_test@localhost:5432/pricepulse_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pricepulse_test
          POSTGRES_USER: pricepulse_test
          POSTGRES_PASSWORD: pricepulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pricepulse_test -d pricepulse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r ../requirements.txt
      - name: Upgrade a fresh PostgreSQL database
        run: alembic -c alembic_canonical.ini upgrade head
      - name: Assert canonical schema constraints
        run: >-
          python -c "from sqlalchemy import create_engine, inspect; from app.config import DATABASE_URL; i=inspect(create_engine(DATABASE_URL)); assert 'users' in i.get_table_names(); assert next(c for c in i.get_columns('price_analysis') if c['name']=='competitor_count')['nullable'] is False; assert 'ix_users_reset_token' in {x['name'] for x in i.get_indexes('users')}"
      - name: Compare full schema with the independent contract
        run: python scripts/db_preflight.py verify-canonical
      - name: Exercise read-only preflight guard tests
        run: python -m pytest -q tests/test_canonical_contract.py tests/test_db_preflight.py tests/test_postgres_canonical_migration.py

  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg2://pricepulse_test:pricepulse_test@localhost:5432/pricepulse_test
      SECRET_KEY: ci-only-secret-key-not-for-deployment
      CHROMA_PERSIST_DIRECTORY: ${{ github.workspace }}/.ci-temp/pricepulse-chroma-${{ github.run_id }}
      OLLAMA_BASE_URL: http://127.0.0.1:9
      OLLAMA_TIMEOUT: '1'
      OLLAMA_IDENTITY_TIMEOUT: '1'
      OLLAMA_RELEVANCE_TIMEOUT: '1'
      OLLAMA_STRATEGIST_TIMEOUT: '1'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pricepulse_test
          POSTGRES_USER: pricepulse_test
          POSTGRES_PASSWORD: pricepulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pricepulse_test -d pricepulse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r ../requirements.txt
      - name: Validate imports and configuration
        run: python -c "from app.main import app; from app.config import DATABASE_URL, OLLAMA_MODEL; assert app.title == 'PricePulse API'; assert DATABASE_URL.startswith('postgresql'); assert OLLAMA_MODEL == 'qwen3:8b'"
      - name: Create canonical PostgreSQL schema for backend tests
        run: alembic -c alembic_canonical.ini upgrade head
      - name: Prepare test result directory
        run: mkdir -p ../test-results
      - name: Run backend tests
        run: python -m pytest -ra --junitxml=../test-results/backend.xml
      - name: Scraping parser and diagnostics tests
        run: >-
          python -m pytest -ra tests/test_scraper_diagnostics.py
          tests/test_multi_platform_scraping.py
          tests/test_amazon_multi_candidate_pipeline.py
          tests/test_product_details_parsing.py
          tests/test_scraping_quantity_reconciliation.py
      - name: Agent orchestration and mocked LLM tests
        run: >-
          python -m pytest -ra tests/test_llm_reliability.py
          tests/test_pricing_workflow.py
          tests/test_evidence_workflow.py
          tests/test_strategist_prompt_context.py
          tests/test_scout_platform_selection.py
          tests/test_product_identity_rag.py
      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: backend-test-results
          path: test-results/backend.xml
          if-no-files-found: ignore
          retention-days: 14

  frontend-tests:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        name: Install frontend dependencies
      - run: npm test
        name: Frontend tests
      - run: npm run build
        name: Frontend production build
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 14

  docker-validation:
    name: Docker build validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      POSTGRES_PASSWORD: compose-ci-only
      SECRET_KEY: ci-only-secret-key-not-for-deployment
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v3.10.0
      - name: Build backend image
        uses: docker/build-push-action@v6.15.0
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: pricepulse-backend:ci
      - name: Build frontend image
        uses: docker/build-push-action@v6.15.0
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          tags: pricepulse-frontend:ci
